name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11.19) matches the dev machine's Node major. Every run from
          # 2026-09-13 to 2026-09-22 failed at `npm ci` with "Missing: @emnapi/runtime from
          # lock file": npm 11.6.2 wrote frontend/package-lock.json without the wasm32
          # optional deps' transitive nodes and its own `ci` never noticed. Write the lock
          # with npm >= 11.19 (see AGENTS.md gotchas).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Next 16 declares route/layout types (LayoutProps, PageProps) in .next/types, which
      # next-env.d.ts imports; a fresh checkout has none until typegen or a build runs.
      - name: Generate route types
        run: npx next typegen
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # plan_ui_foundation D4: blocking since the T7 migration landed at 0 violations.
      - name: Style gate
        run: npm run check:styles
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
