name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 = npm 11, the dev machine's npm. Node 22's npm 10 rejects this lockfile
          # ("Missing: @emnapi/runtime from lock file": npm 11 omits the wasm32 optional
          # deps' transitive nodes that npm 10 insists on). Every CI run failed on that from
          # 2026-09-13 to 2026-09-22.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # plan_ui_foundation D4: blocking since the T7 migration landed at 0 violations.
      - name: Style gate
        run: npm run check:styles
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
