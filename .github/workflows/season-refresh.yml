# season_2026_27 D11. Daily: the card back's current-season averages
# (frontend/public/data/season-stats.json), committed to main only when they changed.
# The weekly card set (`npm run refresh:season`) does NOT run here: stats.nba.com (the
# roster source, fetch_bio.py) times out from GitHub's runners (first dispatch,
# 2026-11-03), so it runs on the owner's machine and opens its PR from there.
name: Season refresh

on:
  schedule:
    - cron: '0 10 * * *'  # daily stats, after the night's games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: season-refresh-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run refresh:stats
      - name: Commit if changed
        run: |
          if git diff --quiet -- frontend/public/data/season-stats.json; then
            echo "No stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/season-stats.json
          git commit -m "chore: season stats $(date -u +%F)"
          git push

