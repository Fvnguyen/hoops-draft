<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Bebas+Neue&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #fafaf9; }
    a { color: #fbbf24; } a:hover { color: #f59e0b; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #0c0a09; display: flex; flex-direction: column;">

  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; border-bottom: 1px solid #292524; display: flex; align-items: center; gap: 16px;">
    <div style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; line-height: 1; color: #fbbf24;">82:0</div>
    <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; color: #a8a29e;">Final stretch</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 12px; font-weight: 700; color: #78716c;">Speed locked for the last five games</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 140px;">

    <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
      <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; color: #78716c;">Game 80 of 82</div>
      <div style="width: 1px; height: 20px; background: #44403c;"></div>
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #1c1917; border: 1px solid #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fafaf9;">OKC</div>
      <div style="font-size: 15px; font-weight: 700; color: #e7e5e4;">vs Oklahoma City</div>
    </div>

    <!-- the flaps slow down and the record is readable for the first time since week one -->
    <div style="display: flex; align-items: center; gap: 28px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 10px;">
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <span style="font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; padding-top: 14px; color: #fafaf9;">7</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <span style="font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; padding-top: 14px; color: #fafaf9;">0</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
        </div>
        <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: #34d399;">Wins</div>
      </div>
      <div style="font-family: 'Bebas Neue', sans-serif; font-size: 120px; line-height: 1; color: #57534e; padding-bottom: 28px;">:</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 10px;">
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <span style="font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; padding-top: 14px; color: #57534e;">0</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <span style="font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; padding-top: 14px; color: #fafaf9;">9</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
        </div>
        <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: #f87171;">Losses</div>
      </div>
    </div>

    <!-- tier ladder with a live needle; the faint marker is the same season without the trade -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="position: relative; width: 1000px;">
        <div style="display: flex; gap: 4px;">
          <div style="flex: 10 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #292524;"></div><div style="font-size: 12px; font-weight: 900; color: #57534e;">F <span style="font-weight: 500;">Tanking</span></div></div>
          <div style="flex: 10 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #292524;"></div><div style="font-size: 12px; font-weight: 900; color: #57534e;">D <span style="font-weight: 500;">Lottery</span></div></div>
          <div style="flex: 7 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #292524;"></div><div style="font-size: 12px; font-weight: 900; color: #57534e;">C <span style="font-weight: 500;">Playoff</span></div></div>
          <div style="flex: 5 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #292524;"></div><div style="font-size: 12px; font-weight: 900; color: #57534e;">B <span style="font-weight: 500;">Contender</span></div></div>
          <div style="flex: 10 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #fbbf24;"></div><div style="font-size: 12px; font-weight: 900; color: #fbbf24;">A <span style="font-weight: 500;">Dynasty</span></div></div>
          <div style="flex: 8 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #44403c;"></div><div style="font-size: 12px; font-weight: 900; color: #d6d3d1;">A+ <span style="font-weight: 500;">Historic</span></div></div>
          <div style="flex: 3 1 0; display: flex; flex-direction: column; gap: 6px;"><div style="height: 14px; border-radius: 4px; background: #292524;"></div><div style="font-size: 12px; font-weight: 900; color: #57534e;">S</div></div>
        </div>
        <div style="position: absolute; left: 692px; top: -8px; width: 2px; height: 30px; background: #78716c; opacity: 0.7;"></div>
        <div style="position: absolute; left: 769px; top: -10px; width: 4px; height: 34px; border-radius: 2px; background: #fafaf9;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="height: 36px; padding: 0 16px; border-radius: 999px; background: #451a03; display: flex; align-items: center; font-size: 13px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #fbbf24;">Win 2 of the last 3 for Historic</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #78716c;"><span style="width: 2px; height: 14px; background: #78716c; display: inline-block;"></span>Same season without the trade</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
