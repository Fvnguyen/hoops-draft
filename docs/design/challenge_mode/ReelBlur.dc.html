<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Bebas+Neue&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #fafaf9; }
    a { color: #fbbf24; } a:hover { color: #f59e0b; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #0c0a09; display: flex; flex-direction: column;">

  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; border-bottom: 1px solid #292524; display: flex; align-items: center; gap: 16px;">
    <div style="font-family: 'Bebas Neue', sans-serif; font-size: 28px; line-height: 1; color: #fbbf24;">82:0</div>
    <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; color: #a8a29e;">First half</div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; border: 1px solid #44403c; border-radius: 8px; overflow: hidden;">
      <button style="height: 44px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #a8a29e; cursor: pointer;">Slower</button>
      <button style="height: 44px; padding: 0 16px; border: 0; background: #fafaf9; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #1c1917; cursor: pointer;">Normal</button>
      <button style="height: 44px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #a8a29e; cursor: pointer;">Instant</button>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 0 140px;">

    <!-- opponents flash by; the streak call-out is the only result signal that leaks -->
    <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
      <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; color: #78716c;">Game 29 of 82</div>
      <div style="width: 1px; height: 20px; background: #44403c;"></div>
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #1c1917; border: 1px solid #44403c; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #a8a29e; opacity: 0.35;">MIA</div>
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #1c1917; border: 1px solid #44403c; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #a8a29e; opacity: 0.6;">SAS</div>
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #1c1917; border: 1px solid #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fafaf9;">BOS</div>
      <div style="height: 32px; padding: 0 12px; border-radius: 999px; background: #451a03; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #fbbf24;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"></path></svg>
        10 straight
      </div>
    </div>

    <!-- flip clock at full speed: flaps in motion, digits unreadable -->
    <div style="display: flex; align-items: center; gap: 28px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 10px;">
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; overflow: hidden;">
            <span style="position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(9px); opacity: 0.55;">2</span>
            <span style="position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(12px); opacity: 0.3;">1</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; overflow: hidden;">
            <span style="position: absolute; left: 0; right: 0; top: -22px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(12px); opacity: 0.4;">8</span>
            <span style="position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(10px); opacity: 0.45;">3</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
        </div>
        <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: #34d399;">Wins</div>
      </div>
      <div style="font-family: 'Bebas Neue', sans-serif; font-size: 120px; line-height: 1; color: #57534e; padding-bottom: 28px;">:</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 10px;">
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; overflow: hidden;">
            <span style="position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(9px); opacity: 0.5;">0</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
          <div style="position: relative; width: 132px; height: 176px; border-radius: 12px; background: #1c1917; border: 1px solid #44403c; overflow: hidden;">
            <span style="position: absolute; left: 0; right: 0; top: -14px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(11px); opacity: 0.4;">6</span>
            <span style="position: absolute; left: 0; right: 0; top: 36px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 168px; line-height: 1; color: #fafaf9; filter: blur(12px); opacity: 0.35;">7</span>
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px; background: #0c0a09;"></div>
          </div>
        </div>
        <div style="font-size: 12px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: #f87171;">Losses</div>
      </div>
    </div>

    <div style="width: 1000px; display: flex; flex-direction: column; gap: 8px;">
      <div style="position: relative; height: 8px; border-radius: 999px; background: #292524;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 35.4%; border-radius: 999px; background: #fbbf24;"></div>
        <div style="position: absolute; left: 50%; top: -6px; width: 2px; height: 20px; background: #78716c;"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; font-size: 12px; font-weight: 700; color: #78716c;">
        <div>Opening night</div>
        <div style="text-align: center;">All-Star break &middot; trade deadline</div>
        <div style="text-align: right;">Game 82</div>
      </div>
    </div>

  </div>

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #78716c;">Tap anywhere to jump to the All-Star break.</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
